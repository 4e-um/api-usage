# =============================================================================
# Cloud Run 프로필 설정
# =============================================================================
# Cloud Run에서 Cloud SQL 연결 시 Socket Factory 사용
# Terraform이 제공하는 환경변수:
#   - DB_INSTANCE_CONNECTION_NAME: Cloud SQL 연결 이름
#   - POSTGRES_DATABASE: 데이터베이스 이름
#   - POSTGRES_USER: 데이터베이스 사용자
#   - POSTGRES_PASSWORD: 데이터베이스 비밀번호
#   - REDIS_ENDPOINT: Redis 외부 IP:포트
#   - REDIS_PASSWORD: Redis 비밀번호
#   - KAFKA_BOOTSTRAP_SERVERS: Kafka 부트스트랩 서버
#   - KAFKA_API_KEY: Kafka API 키
#   - KAFKA_API_SECRET: Kafka API 시크릿
# =============================================================================

spring:
  # MongoDB 비활성화 (Cloud Run에서 미사용)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql:///${POSTGRES_DATABASE}?cloudSqlInstance=${DB_INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false

  data:
    mongodb:
      uri: ""
    redis:
      url: redis://default:${REDIS_PASSWORD}@${REDIS_ENDPOINT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: >
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username='${KAFKA_API_KEY}'
        password='${KAFKA_API_SECRET}';

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      auto-startup: true

# MongoDB Health Check 비활성화
management:
  health:
    mongo:
      enabled: false
